name: Publish to itch.io
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: itch-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check game syntax
        run: |
          node --check game.js
          node tests/story.test.cjs
      - name: Build upload folder
        run: |
          mkdir -p build
          cp index.html styles.css game.js build/
          cp character-models.js world-generator.js build/
          mkdir -p build/assets/characters
          cp assets/characters/characters.js build/assets/characters/
          cp -R vendor build/
      - name: Download Butler
        run: |
          curl --fail --location --retry 3 -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler
          chmod +x butler/butler
      - name: Upload HTML5 build
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_USER: ${{ vars.ITCH_USER }}
          ITCH_GAME: ${{ vars.ITCH_GAME }}
        run: |
          test -n "$BUTLER_API_KEY" || (echo "Missing BUTLER_API_KEY secret" && exit 1)
          test -n "$ITCH_USER" || (echo "Missing ITCH_USER variable" && exit 1)
          test -n "$ITCH_GAME" || (echo "Missing ITCH_GAME variable" && exit 1)
          ./butler/butler push build "$ITCH_USER/$ITCH_GAME:html5" --userversion "$GITHUB_SHA"
